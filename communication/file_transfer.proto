syntax = "proto3";

package filetransfer;

service FileTransferService {
  rpc UploadFile(stream FileChunk) returns (UploadStatus);
}

message FileInfo {
  string filename = 1;
  int64 filesize = 2;
  string sha256 = 3;
  string sender_name = 4;
}

message FileChunk {
  oneof payload {
    FileInfo info = 1;
    bytes chunk_data = 2;
  }
}

message UploadStatus {
  bool ok = 1;
  string message = 2;
  string saved_path = 3;
  int64 bytes_received = 4;
  string sha256 = 5;
}
